name: Generate index

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate index.html
        run: node generate-index.js

      - name: Verify generated index is current
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- index.html generate-index.js

      - name: Commit generated index
        if: github.event_name == 'push'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'chore: update generated index'
          file_pattern: index.html

      - name: Upload generated index artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-index
          path: index.html
